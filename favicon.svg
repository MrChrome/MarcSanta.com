<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 3 56 56">
  <g stroke="#2b1d15" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- shoulders, pale yellow V-neck -->
    <path d="M6 64 Q7 53 20 50 L44 50 Q57 53 58 64 Z" fill="#f4efb2"/>
    <path d="M25 50 L32 58 L39 50" fill="#efa98d"/>
    <!-- ears -->
    <ellipse cx="14.5" cy="30" rx="3" ry="4.2" fill="#efa98d"/>
    <ellipse cx="49.5" cy="30" rx="3" ry="4.2" fill="#efa98d"/>
    <!-- face -->
    <path d="M15 27 Q15 9 32 9 Q49 9 49 27 L49 34 Q49 51 32 51 Q15 51 15 34 Z" fill="#f2b49a"/>
    <!-- beard -->
    <path d="M15 30 Q15 53 32 53 Q49 53 49 30 Q47 41 40 42 Q32 39 24 42 Q17 41 15 30 Z" fill="#6b4630"/>
    <!-- hair, swept to the side -->
    <path d="M14.5 27 Q12 8 30 6.5 Q46 5.5 50.5 18 Q51 23 49.5 27 Q48.5 20 45 17 Q41 15.5 37 17.5 Q33 19.5 29 16.5 Q24 14 19.5 18 Q16 21 14.5 27 Z" fill="#4a3123"/>
    <!-- grin -->
    <path d="M23.5 41.5 Q32 37.5 40.5 41.5 Q37.5 48.5 32 48.5 Q26.5 48.5 23.5 41.5 Z" fill="#8a3229"/>
    <path d="M24.6 42 Q32 39 39.4 42 L38.6 44 Q32 41.8 25.4 44 Z" fill="#fff" stroke-width="0.8"/>
  </g>
  <!-- rosy cheeks -->
  <ellipse cx="20.5" cy="34" rx="3.6" ry="2.4" fill="#e8746a" opacity="0.55"/>
  <ellipse cx="43.5" cy="34" rx="3.6" ry="2.4" fill="#e8746a" opacity="0.55"/>
  <g fill="none" stroke="#2b1d15" stroke-width="1.8" stroke-linecap="round">
    <!-- happy squinting eyes -->
    <path d="M20.5 28.5 Q23.5 25.5 26.5 28.5"/>
    <path d="M37.5 28.5 Q40.5 25.5 43.5 28.5"/>
    <!-- brows -->
    <path d="M20 22.8 Q23.5 21 27 22.4" stroke="#4a3123" stroke-width="1.6"/>
    <path d="M37 22.4 Q40.5 21 44 22.8" stroke="#4a3123" stroke-width="1.6"/>
    <!-- nose -->
    <path d="M31 31.5 Q32 34.5 34 33.5" stroke-width="1.4"/>
  </g>
</svg>
