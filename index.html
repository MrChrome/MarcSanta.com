<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marc Santa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="topbar-name" href="#top">Marc Santa</a>
    <nav class="topbar-nav">
      <a class="nav-link" href="other/">Other stuff</a>
      <a class="nav-link nav-icon" href="https://github.com/MrChrome" target="_blank" rel="noopener" aria-label="GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
      </a>
      <div class="resume-dropdown" id="resumeDropdown">
        <button class="pdf-btn" onclick="toggleResumeDropdown()">
          Resume
          <svg class="dropdown-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="1,1 5,5 9,1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="resume-dropdown-menu">
          <button onclick="exportPDF(); closeResumeDropdown()">Download PDF</button>
          <button onclick="exportWord(); closeResumeDropdown()">Download Word</button>
          <button onclick="exportText(); closeResumeDropdown()">Download Text</button>
          <button onclick="exportJSON(); closeResumeDropdown()">Download JSON</button>
          <button onclick="exportMarkdown(); closeResumeDropdown()">Download Markdown</button>
          <button onclick="exportLatex(); closeResumeDropdown()">Download LaTeX</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" id="top">
      <p class="eyebrow"><span class="eyebrow-dot"></span>Greater Detroit, MI</p>
      <h1>Marc <em>Santa</em></h1>
      <p class="lede" id="lede"></p>
      <dl class="stats" id="stats"></dl>
      <a class="scroll-cue" href="#chrono">
        <span id="scrollCueText">Start at the beginning</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v12M2 8l5 5 5-5"/></svg>
      </a>
    </section>

    <section class="chrono" id="chrono" aria-label="Timeline">
      <div class="lane-heads">
        <span>Year</span>
        <span>School &amp; work</span>
        <span>Family</span>
      </div>
      <div class="chrono-body">
        <div class="ruler" id="ruler" aria-hidden="true"><div class="ruler-fill" id="rulerFill"></div></div>
        <div class="career" id="career"></div>
        <div class="life" id="life"></div>
      </div>
    </section>

    <section class="today">
      <p class="eyebrow"><span class="eyebrow-dot"></span>Today</p>
      <h2>That brings us to <em>now</em>.</h2>
      <p class="today-sub">Take the whole thing with you, in whatever format you like.</p>
      <div class="downloads">
        <button class="dl dl-primary" onclick="exportPDF()">PDF</button>
        <button class="dl" onclick="exportWord()">Word</button>
        <button class="dl" onclick="exportText()">Text</button>
        <button class="dl" onclick="exportMarkdown()">Markdown</button>
        <button class="dl" onclick="exportJSON()">JSON</button>
        <button class="dl" onclick="exportLatex()">LaTeX</button>
      </div>
      <footer class="foot">
        <a href="other/">Other stuff</a>
        <a href="https://github.com/MrChrome" target="_blank" rel="noopener">GitHub</a>
        <a href="#top">Back to top</a>
      </footer>
    </section>
  </main>

  <div class="year-counter" id="yearCounter" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8/build/index.umd.min.js"></script>
</body>
</html>
