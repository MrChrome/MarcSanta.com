<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marc Santa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="resume-dropdown" id="resumeDropdown">
    <button class="pdf-btn" onclick="toggleResumeDropdown()">
      Resume
      <svg class="dropdown-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="1,1 5,5 9,1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="resume-dropdown-menu">
      <button onclick="exportPDF(); closeResumeDropdown()">Download PDF</button>
      <button onclick="exportWord(); closeResumeDropdown()">Download Word</button>
      <button onclick="exportText(); closeResumeDropdown()">Download Text</button>
      <button onclick="exportJSON(); closeResumeDropdown()">Download JSON</button>
      <button onclick="exportMarkdown(); closeResumeDropdown()">Download Markdown</button>
      <button onclick="exportLatex(); closeResumeDropdown()">Download LaTeX</button>
    </div>
  </div>
  <div class="pdf-hint">
    <span>learn more</span>
    <svg width="54" height="46" viewBox="0 0 54 46" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 3,39 L 28,39 Q 48,39 48,12" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 42,18 L 48,10 L 54,18" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="timeline-container">
    <h1>Marc Santa</h1>
    <p class="mobile-hint">Tap on an experience to learn more</p>
    <div class="mobile-chevrons">
      <svg width="24" height="40" viewBox="0 0 24 40" fill="none" stroke="#0c4a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6,38 12,30 18,38" opacity="0.4"/>
        <polyline points="6,25 12,17 18,25" opacity="0.65"/>
        <polyline points="6,12 12,4 18,12" opacity="1"/>
      </svg>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8/build/index.umd.min.js"></script>
</body>
</html>
