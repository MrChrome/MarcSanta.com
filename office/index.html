<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>New Office</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1c1c1c; --muted:#77736b; --card:#e6e3dc; --accent:#1c1c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#eeece6; --muted:#8d8a82; --card:#222221; --accent:#eeece6; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  #gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  #gate form { display:flex; flex-direction:column; gap:12px; width:min(320px,100%); text-align:center; }
  #gate h1 { font-weight:600; font-size:22px; margin:0 0 4px; }
  input, button { font:inherit; padding:11px 14px; border-radius:10px; border:1px solid var(--muted); background:transparent; color:var(--fg); }
  button { background:var(--accent); color:var(--bg); border-color:var(--accent); cursor:pointer; }
  #err { color:#c0392b; min-height:1.5em; font-size:14px; }
  #app { display:none; }
  header { padding:40px 16px 20px; max-width:1400px; margin:0 auto; }
  header h1 { margin:0; font-size:28px; font-weight:600; letter-spacing:-.01em; }
  header p { margin:4px 0 0; color:var(--muted); }
  #grid { max-width:1400px; margin:0 auto; padding:0 16px 48px; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  #grid button { padding:0; border:0; background:var(--card); border-radius:8px; overflow:hidden; aspect-ratio:4/3; cursor:zoom-in; }
  #grid img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s; }
  #grid button:hover img { transform:scale(1.04); }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; z-index:10; user-select:none; }
  #lb.open { display:flex; }
  #lb img { max-width:100vw; max-height:100vh; object-fit:contain; }
  #lb .ctl { position:absolute; background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:50%; width:48px; height:48px; font-size:24px; line-height:1; padding:0; cursor:pointer; }
  #lb .ctl:hover { background:rgba(255,255,255,.25); }
  #prev { left:16px; top:50%; transform:translateY(-50%); } #next { right:16px; top:50%; transform:translateY(-50%); }
  #close { right:16px; top:16px; }
  #count { position:absolute; bottom:16px; left:0; right:0; text-align:center; color:#ccc; font-size:14px; }
  @media (max-width:600px) { #grid { grid-template-columns:repeat(2,1fr); gap:6px; } #prev,#next { display:none; } }
</style>
</head>
<body>
<div id="gate">
  <form id="form">
    <h1>New Office</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
    <div id="err"></div>
  </form>
</div>
<div id="app">
  <header><h1>New Office</h1><p id="sub"></p></header>
  <div id="grid"></div>
</div>
<div id="lb">
  <img id="lbimg" alt="">
  <button class="ctl" id="prev" aria-label="Previous">&#8249;</button>
  <button class="ctl" id="next" aria-label="Next">&#8250;</button>
  <button class="ctl" id="close" aria-label="Close">&times;</button>
  <div id="count"></div>
</div>
<script>
const IMAGES = ["IMG_1081","IMG_1082","IMG_1083","IMG_1085","IMG_1086","IMG_1087","IMG_1088","IMG_1089","IMG_1090","IMG_1091","IMG_1092","IMG_1093","IMG_1094","IMG_1095","IMG_1096","IMG_1097","IMG_1098","IMG_1099","IMG_1100","IMG_1101","IMG_1102","IMG_1103","IMG_1104","IMG_1105","IMG_1106","IMG_1107","IMG_1108","IMG_1109","IMG_1110","IMG_1111","IMG_1112","IMG_1113","IMG_1114","IMG_1115","IMG_1116","IMG_1117","IMG_1118","IMG_1119","IMG_1120","IMG_1121","IMG_1122"];
const KEY = "office-auth";
const $ = id => document.getElementById(id);
let cur = 0;

function unlock() {
  $("gate").style.display = "none";
  $("app").style.display = "block";
  $("sub").textContent = IMAGES.length + " photos";
  $("grid").innerHTML = IMAGES.map((n, i) =>
    '<button data-i="' + i + '"><img loading="lazy" src="thumb/' + n + '.jpg" alt="Photo ' + (i + 1) + '"></button>').join("");
}
function show(i) {
  cur = (i + IMAGES.length) % IMAGES.length;
  $("lbimg").src = "full/" + IMAGES[cur] + ".jpg";
  $("count").textContent = (cur + 1) + " / " + IMAGES.length;
  new Image().src = "full/" + IMAGES[(cur + 1) % IMAGES.length] + ".jpg";
}
function openLb(i) { show(i); $("lb").classList.add("open"); }
function closeLb() { $("lb").classList.remove("open"); }

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if ($("pw").value.trim().toLowerCase() === "urban") {
    try { localStorage.setItem(KEY, "1"); } catch (_) {}
    unlock();
  } else {
    $("err").textContent = "Incorrect password";
    $("pw").select();
  }
});
$("grid").addEventListener("click", e => { const b = e.target.closest("button"); if (b) openLb(+b.dataset.i); });
$("prev").onclick = e => { e.stopPropagation(); show(cur - 1); };
$("next").onclick = e => { e.stopPropagation(); show(cur + 1); };
$("close").onclick = closeLb;
$("lb").addEventListener("click", e => { if (e.target === $("lb") || e.target === $("lbimg")) closeLb(); });
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "ArrowRight") show(cur + 1);
});
let sx = null;
$("lb").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});
try { if (localStorage.getItem(KEY) === "1") unlock(); } catch (_) {}
</script>
</body>
</html>
